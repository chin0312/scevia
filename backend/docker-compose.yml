services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scevia}
      POSTGRES_USER: ${POSTGRES_USER:-scevia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scevia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scevia} -d ${POSTGRES_DB:-scevia}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  scevia-postgres:
