name: Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: scevia_test
          POSTGRES_USER: scevia
          POSTGRES_PASSWORD: scevia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scevia -d scevia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://scevia:scevia@localhost:5432/scevia_test
      TEST_DATABASE_URL: postgresql://scevia:scevia@localhost:5432/scevia_test
      NODE_ENV: test
      DEV_AUTH_TOKEN: ci-test-token-with-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run db:migrate
      - run: npm audit --audit-level=high
